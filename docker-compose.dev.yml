services:
  pubsub-init:
    build:
      context: .
      dockerfile: apps/worker-aggregation/Dockerfile.dev
    container_name: project-base_pubsub_init
    entrypoint: []
    command: ["pnpm", "exec", "tsx", "/app/scripts/init-pubsub-emulator.ts"]
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts
    environment:
      PUBSUB_EMULATOR_HOST: firebase-emulator:8085
      GCP_PROJECT_ID: demo-project-base
      AGGREGATION_EVENTS_TOPIC: aggregation-events
    depends_on:
      firebase-emulator:
        condition: service_healthy
    restart: "no"

  firebase-emulator:
    image: andreysenov/firebase-tools
    container_name: project-base_firebase_emulator
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8085:8085"
      - "9099:9099"
      - "4000:4000"
      - "9199:9199"
      - "5002:5002"
    command:
      [
        "firebase",
        "emulators:start",
        "--only",
        "firestore,auth,storage,hosting,pubsub",
        "--project=demo-project-base",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const n=require('net');const p=(h,o)=>new Promise(r=>{const s=n.createConnection({host:h,port:o},()=>{s.end();r(true)});s.on('error',()=>r(false));});Promise.all([p('127.0.0.1',9099),p('127.0.0.1',8080),p('127.0.0.1',8085)]).then(x=>process.exit(x.every(Boolean)?0:1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s
    volumes:
      # Hosting emulator serves apps/web/build/client — run `pnpm --filter web build` before start
      - ./firebase.json:/home/node/firebase.json
      - ./.firebaserc:/home/node/.firebaserc
      - ./firestore.rules:/home/node/firestore.rules
      - ./firestore.indexes.json:/home/node/firestore.indexes.json
      - ./storage.rules:/home/node/storage.rules
      - ./apps/web/build/client:/home/node/apps/web/build/client

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: project-base_api_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./turbo.json:/app/turbo.json
      - ./apps/api:/app/apps/api
      - ./apps/platform:/app/apps/platform
      - ./packages:/app/packages
      - ./scripts:/app/scripts
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/eslint-config/node_modules
    env_file:
      - ./apps/api/.env.dev
    environment:
      - NODE_ENV=development
      - FIRESTORE_EMULATOR_HOST=firebase-emulator:8080
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulator:9099
      - FIREBASE_STORAGE_EMULATOR_HOST=firebase-emulator:9199
      - FIREBASE_STORAGE_EMULATOR_PUBLIC_HOST=127.0.0.1:9199
      - GCP_STORAGE_BUCKET=demo-project-base.appspot.com
      - PUBSUB_EMULATOR_HOST=firebase-emulator:8085
      - AGGREGATION_EVENTS_PUBSUB=true
      - AGGREGATION_EVENTS_TOPIC=aggregation-events
      - WORKER_SERVICE_URL=http://worker-service:3001
      - AI_TASKS_LOCAL_DISPATCH=true
      - CLOUD_TASKS_QUEUE_NAME=ai-jobs
      - GMAIL_TASKS_LOCAL_DISPATCH=true
      - GMAIL_TASKS_QUEUE_NAME=gmail-jobs
      - GMAIL_OAUTH_REDIRECT_URI=http://127.0.0.1:3000/api/gmail/oauth/callback
      - WEB_APP_ORIGIN=http://127.0.0.1:5173
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      firebase-emulator:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      worker-service:
        condition: service_started

  worker-aggregation:
    build:
      context: .
      dockerfile: apps/worker-aggregation/Dockerfile.dev
    container_name: project-base_worker_aggregation_dev
    restart: unless-stopped
    volumes:
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./apps/worker-aggregation:/app/apps/worker-aggregation
      - ./packages:/app/packages
      - ./scripts:/app/scripts
      - /app/node_modules
      - /app/apps/worker-aggregation/node_modules
      - /app/packages/eslint-config/node_modules
    environment:
      - NODE_ENV=development
      - GCP_PROJECT_ID=demo-project-base
      - PUBSUB_EMULATOR_HOST=firebase-emulator:8085
      - FIRESTORE_EMULATOR_HOST=firebase-emulator:8080
      - AGGREGATION_EVENTS_TOPIC=aggregation-events
    depends_on:
      firebase-emulator:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully

  worker-service:
    build:
      context: .
      dockerfile: apps/worker-service/Dockerfile.dev
    container_name: project-base_worker_service_dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./apps/worker-service:/app/apps/worker-service
      - ./apps/platform:/app/apps/platform
      - ./packages:/app/packages
      - ./scripts:/app/scripts
      - /app/node_modules
      - /app/apps/worker-service/node_modules
      - /app/packages/eslint-config/node_modules
    env_file:
      - ./apps/worker-service/.env.dev
    environment:
      - NODE_ENV=development
      - IS_LOCAL=true
      - PORT=3001
      - FIRESTORE_EMULATOR_HOST=firebase-emulator:8080
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulator:9099
      - FIREBASE_STORAGE_EMULATOR_HOST=firebase-emulator:9199
      - FIREBASE_STORAGE_EMULATOR_PUBLIC_HOST=127.0.0.1:9199
      - TASKS_SA_EMAIL=local-tasks-sa@demo-project-base.iam.gserviceaccount.com
      - WORKER_SERVICE_URL=http://worker-service:3001
      - GMAIL_TASKS_LOCAL_DISPATCH=true
    depends_on:
      firebase-emulator:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: project-base_web_dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./apps/web:/app/apps/web
      - ./apps/platform:/app/apps/platform
      - ./packages:/app/packages
      - ./scripts:/app/scripts
      - /app/node_modules
      - /app/apps/web/node_modules
      # Preserve Linux node_modules from the image (host bind-mount of ./packages overwrites them)
      - /app/packages/eslint-config/node_modules
    environment:
      - NODE_ENV=development
      # Browser uses published host ports (127.0.0.1), not Docker service names.
      # Tunnel mode overrides these via docker-compose.dev.tunnel.yml
      - VITE_API_URL=http://127.0.0.1:3000
      - VITE_FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099
      - VITE_FIREBASE_AUTH_EMULATOR_DISABLE_WARNINGS=true
      - VITE_FIREBASE_API_KEY=fake-api-key
      - VITE_FIREBASE_AUTH_DOMAIN=localhost
      - VITE_FIREBASE_PROJECT_ID=demo-project-base
      - VITE_FIREBASE_STORAGE_BUCKET=demo-project-base.appspot.com
      - VITE_FIREBASE_MESSAGING_SENDER_ID=123456789
      - VITE_FIREBASE_APP_ID=1:123456789:web:abcdef
      # Deployed builds use VITE_APP_CHECK_RECAPTCHA_SITE_KEY (see apps/web/.env.development.example)
    depends_on:
      firebase-emulator:
        condition: service_healthy
      api:
        condition: service_healthy
      worker-aggregation:
        condition: service_started
      worker-service:
        condition: service_started

volumes: {}
